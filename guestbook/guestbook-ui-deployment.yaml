apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - name: guestbook-ui
        image: quay.io/argoprojlabs/argocd-e2e-container:0.2
        command: ["/bin/sh", "-c", "echo Hello && sleep infinity"]
        ports:
        - containerPort: 80
